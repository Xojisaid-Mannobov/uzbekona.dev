# Uzbekona.dev — to'liq stack: nginx + frontend + backend + postgres + redis
#
#   cp .env.example .env   # qiymatlarni to'ldiring
#   docker compose up -d --build
#
# Sayt: http://localhost  ·  Admin: http://localhost/admin  ·  API: http://localhost/api/v1

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uzbekona}
      POSTGRES_USER: ${POSTGRES_USER:-uzbekona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env faylida bo'lishi shart}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-uzbekona} -d ${POSTGRES_DB:-uzbekona}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-uzbekona}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-uzbekona}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env faylida bo'lishi shart (kamida 32 belgi)}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://uzbekona.dev}
      TRUST_PROXY: 'true'
      UPLOAD_DIR: /app/storage/uploads
      UPLOAD_URL: /uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      SEED_DEMO: ${SEED_DEMO:-true}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - uploads:/app/storage/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/uploads:ro

volumes:
  postgres_data:
  redis_data:
  uploads:
