# Uzbekona.dev — asosiy reverse proxy
#
#   Cloudflare → Nginx ─┬─ /            → frontend (Vue static)
#                       ├─ /admin/*     → frontend (shu SPA ichida)
#                       ├─ /api/v1/*    → backend (Go API)
#                       └─ /uploads/*   → media volume (to'g'ridan-to'g'ri disk)

upstream backend {
    server backend:8080;
    keepalive 32;
}

upstream frontend {
    server frontend:80;
}

# Cloudflare orqasida bo'lsa haqiqiy mijoz IP'si (rate limit va loglar uchun).
# Cloudflare IP ro'yxati: https://www.cloudflare.com/ips/
# set_real_ip_from 173.245.48.0/20;
# ...
# real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 110m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ─── Xavfsizlik sarlavhalari ───────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─── API ───────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # ─── Yuklangan media ───────────────────────────────
    location /uploads/ {
        alias /var/www/uploads/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        # SVG ichidagi har qanday skript ishlamasligi uchun qat'iy CSP
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; media-src 'self'; sandbox" always;
        try_files $uri =404;
    }

    # ─── Frontend (public sayt + admin panel) ──────────
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
