# Uzbekona.dev — asosiy reverse proxy
#
#   Cloudflare → Nginx ─┬─ /            → frontend (Vue static)
#                       ├─ /admin/*     → frontend (shu SPA ichida)
#                       ├─ /api/v1/*    → backend (Go API)
#                       └─ /uploads/*   → media volume (to'g'ridan-to'g'ri disk)

# Docker DNS: konteyner qayta yaratilib IP'si o'zgarsa ham Nginx'ni qayta ishga tushirish shart emas.
# (upstream{} bloki nomni faqat start paytida bir marta hal qiladi — shuning uchun o'zgaruvchi + resolver.)
resolver 127.0.0.11 valid=5s ipv6=off;

# Cloudflare Tunnel (cloudflared) orqasida: haqiqiy mijoz IP'si CF-Connecting-IP sarlavhasida keladi.
# Nginx portga faqat 127.0.0.1 dan (cloudflared) yetib boriladi, shuning uchun ichki tarmoqdan
# kelgan sarlavhaga ishonamiz. Bo'lmasa rate limit va statistika barcha mijozni bitta IP deb hisoblaydi.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 110m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ─── Xavfsizlik sarlavhalari ───────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─── API ───────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=40 nodelay;

        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # ─── Yuklangan media ───────────────────────────────
    location /uploads/ {
        alias /var/www/uploads/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        # SVG ichidagi har qanday skript ishlamasligi uchun qat'iy CSP
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; media-src 'self'; sandbox" always;
        try_files $uri =404;
    }

    # ─── Frontend (public sayt + admin panel) ──────────
    location / {
        set $web_upstream http://frontend:80;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
