# Frontend konteyneri: Vue build'ni statik beradi (SPA fallback bilan)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hash'li asset'lar — 1 yil kesh
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html hech qachon keshlanmaydi — yangi deploy darhol ko'rinadi
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
